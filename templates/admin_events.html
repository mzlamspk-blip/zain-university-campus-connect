{% extends "base.html" %}{% block content %}<div class="container dashboard-wrap"><div class="page-head"><h2>Manage events</h2><p>Create campus events and view registrations.</p></div><div class="row g-4"><div class="col-lg-5"><div class="panel p-4"><h5>Create event</h5><form method="post" enctype="multipart/form-data"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label class="form-label">Title</label><input class="form-control mb-3" name="title" required><label class="form-label">Description</label><textarea class="form-control mb-3" name="description" required></textarea><label class="form-label">Venue</label><input class="form-control mb-3" name="venue" required><label class="form-label">Date & time</label><input class="form-control mb-3" type="datetime-local" name="event_date" required><label class="form-label">Banner</label><input class="form-control mb-3" type="file" name="banner" accept="image/*"><button class="btn btn-primary w-100">Create event</button></form></div></div><div class="col-lg-7"><div class="panel p-3">{% for e in rows %}<div class="list-row"><div><strong>{{ e.title }}</strong><small>{{ e.event_date }} · {{ e.venue }}</small></div><div class="d-flex gap-2"><a class="btn btn-sm btn-outline-primary" href="{{ url_for('event_registrations',eid=e._id|string) }}">Registrations</a><form method="post" action="{{ url_for('delete_event',eid=e._id|string) }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="btn btn-sm btn-outline-danger">Delete</button></form></div></div>{% endfor %}</div></div></div></div>{% endblock %}
