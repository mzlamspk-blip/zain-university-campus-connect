{% extends "base.html" %}{% block content %}<div class="container dashboard-wrap"><div class="page-head d-flex justify-content-between align-items-center"><div><h2>Notifications</h2><p>Updates from your campus activity.</p></div><form method="post" action="{{ url_for('notifications_read') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="btn btn-sm btn-outline-primary">Mark all as read</button></form></div><div class="panel p-3">{% for n in rows %}<div class="list-row"><div><strong>{{ n.title }}</strong><small>{{ n.message }}</small></div><small>{{ n.created_at.strftime('%d %b %Y %I:%M %p') }}</small>{% if n.link %}<a href="{{ n.link }}">Open</a>{% endif %}</div>{% else %}<p class="text-muted p-3">You're all caught up.</p>{% endfor %}</div></div>{% endblock %}
