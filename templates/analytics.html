{% extends "base.html" %}{% block content %}<div class="container dashboard-wrap"><div class="page-head"><span class="eyebrow">DATA INSIGHTS</span><h2>Campus analytics</h2><p>Live reports calculated from your MongoDB database.</p></div><div class="row g-4"><div class="col-lg-6"><div class="panel p-4"><h5>Complaints by status</h5><canvas id="statusChart"></canvas></div></div><div class="col-lg-6"><div class="panel p-4"><h5>Monthly complaints</h5><canvas id="monthlyChart"></canvas></div></div><div class="col-lg-6"><div class="panel p-4"><h5>Complaints by department</h5><canvas id="deptChart"></canvas></div></div><div class="col-lg-6"><div class="panel p-4"><h5>Event participation</h5><canvas id="eventChart"></canvas></div></div><div class="col-lg-6"><div class="panel p-4"><h5>Student registrations</h5><canvas id="studentChart"></canvas></div></div></div></div>{% endblock %}{% block scripts %}<script src="https://cdn.jsdelivr.net/npm/chart.js"></script><script>
const chartData={{ {'status':status,'monthly':monthly,'dept':dept,'events':participation,'students':registrations}|tojson }};
function makeChart(id,type,data){const el=document.getElementById(id);if(!el)return;new Chart(el,{type,data:{labels:data.map(x=>x.label),datasets:[{label:'Records',data:data.map(x=>x.total),borderWidth:2,borderRadius:6}]},options:{responsive:true,plugins:{legend:{display:type==='doughnut'}},scales:type==='doughnut'?{}:{y:{beginAtZero:true,ticks:{precision:0}}}}});}
makeChart('statusChart','doughnut',chartData.status);makeChart('monthlyChart','line',chartData.monthly);makeChart('deptChart','bar',chartData.dept);makeChart('eventChart','bar',chartData.events);makeChart('studentChart','line',chartData.students);
</script>{% endblock %}
