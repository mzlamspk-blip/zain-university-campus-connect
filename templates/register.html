{% extends "base.html" %}{% block title %}Register · Campus Connect{% endblock %}{% block content %}
<div class="auth-wrap"><div class="auth-card wide"><span class="eyebrow">JOIN THE COMMUNITY</span><h2>Create your student account</h2><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="row g-3">
<div class="col-md-6"><label class="form-label">Full name *</label><input class="form-control" name="full_name" required></div><div class="col-md-6"><label class="form-label">Username *</label><input class="form-control" name="username" required></div>
<div class="col-md-6"><label class="form-label">Email *</label><input class="form-control" type="email" name="email" required></div><div class="col-md-6"><label class="form-label">Student ID</label><input class="form-control" name="student_id"></div>
<div class="col-md-6"><label class="form-label">Department</label><input class="form-control" name="department" placeholder="e.g. BS Information Technology"></div><div class="col-md-6"><label class="form-label">Password * (8+ characters)</label><input class="form-control" type="password" name="password" minlength="8" required></div>
</div><button class="btn btn-primary w-100 mt-4">Create account</button></form><p class="small mt-3">Already registered? <a href="{{ url_for('login') }}">Sign in</a></p></div></div>{% endblock %}
