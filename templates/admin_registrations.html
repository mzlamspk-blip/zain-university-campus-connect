{% extends "base.html" %}{% block content %}<div class="container dashboard-wrap"><a href="{{ url_for('manage_events') }}">← Back to events</a><div class="page-head"><h2>{{ event.title }} registrations</h2></div><div class="panel table-responsive"><table class="table"><thead><tr><th>Name</th><th>Username</th><th>Email</th><th>Department</th><th>Registered</th></tr></thead><tbody>{% for s in rows %}<tr><td>{{ s.full_name }}</td><td>{{ s.username }}</td><td>{{ s.email }}</td><td>{{ s.department }}</td><td>{{ s.registered_at }}</td></tr>{% else %}<tr><td colspan="5">No registrations yet.</td></tr>{% endfor %}</tbody></table></div></div>{% endblock %}
