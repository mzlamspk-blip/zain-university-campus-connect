{% extends "base.html" %}{% block title %}Login · Campus Connect{% endblock %}{% block content %}
<div class="auth-wrap"><div class="auth-card"><span class="eyebrow">WELCOME BACK</span><h2>Sign in to Campus Connect</h2><p class="text-muted">Choose the portal you want to access.</p>
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label class="form-label">Portal</label><select class="form-select mb-3" name="role"><option value="student">Student portal</option><option value="admin">Admin portal</option></select>
<label class="form-label">Username or email</label><input class="form-control mb-3" name="identity" required autocomplete="username"><label class="form-label">Password</label><input class="form-control mb-4" type="password" name="password" required autocomplete="current-password"><button class="btn btn-primary w-100">Sign in</button></form>
<p class="small mt-3 mb-0">New student? <a href="{{ url_for('register') }}">Create an account</a></p></div></div>{% endblock %}
