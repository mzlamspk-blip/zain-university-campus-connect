{% extends "base.html" %}{% block content %}<div class="container dashboard-wrap"><div class="page-head"><h2>My profile</h2><p>Manage your student information and account security.</p></div><div class="row g-4"><div class="col-md-6"><div class="panel p-4"><h5>Profile information</h5><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="action" value="profile"><label class="form-label">Full name</label><input class="form-control mb-3" name="full_name" value="{{ row.full_name }}" required><label class="form-label">Department</label><input class="form-control mb-3" name="department" value="{{ row.department }}"><label class="form-label">Student ID</label><input class="form-control mb-3" name="student_id" value="{{ row.student_id }}"><button class="btn btn-primary">Save profile</button></form></div></div><div class="col-md-6"><div class="panel p-4"><h5>Change password</h5><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="action" value="password"><label class="form-label">Current password</label><input class="form-control mb-3" type="password" name="current_password" required><label class="form-label">New password</label><input class="form-control mb-3" type="password" name="new_password" minlength="8" required><button class="btn btn-primary">Change password</button></form></div></div></div></div>{% endblock %}
