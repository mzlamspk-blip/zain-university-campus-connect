{% extends "base.html" %}{% block content %}<div class="container dashboard-wrap"><div class="page-head"><h2>Lost & Found reports</h2></div><div class="panel table-responsive"><table class="table align-middle"><thead><tr><th>Type</th><th>Item</th><th>Student</th><th>Location</th><th>Date</th><th>Status</th><th></th></tr></thead><tbody>{% for i in rows %}<tr><td>{{ i.report_type }}</td><td>{{ i.item_name }}<small class="d-block text-muted">{{ i.description }}</small></td><td>{{ i.full_name }}</td><td>{{ i.location }}</td><td>{{ i.item_date }}</td><td>{{ i.status }}</td><td><form method="post" action="{{ url_for('admin_delete_item',item_id=i._id|string) }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="btn btn-sm btn-outline-danger">Delete</button></form></td></tr>{% endfor %}</tbody></table></div></div>{% endblock %}
